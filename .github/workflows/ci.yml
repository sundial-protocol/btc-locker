name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

  # Regtest suites: each package broadcasts its own transactions on a local
  # bitcoind and checks what the chain says. One job per package, each complete
  # on its own, so a job can move with its package to another repository. They
  # are kept out of the matrix above: they do not depend on the Node version.

  # Timelock and escrow scripts, and the Dawn transaction builders.
  regtest-core:
    name: Core regtest (bitcoind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Build the package and what it depends on
        run: npx turbo run build --filter=@sundial-protocol/btc-locker

      # Release binaries, pinned by SHA-256 in the harness's regtest.sh.
      - name: Cache regtest binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/btc-regtest/bin
          key: btc-regtest-${{ runner.os }}-${{ hashFiles('node_modules/@sundial-protocol/btc-regtest/regtest.sh') }}

      - name: Run the regtest suite
        run: npm run regtest --workspace=@sundial-protocol/btc-locker

      - name: Show daemon logs
        if: failure()
        run: npx btc-regtest logs

  # The receipt rune and the swaps, as indexed by ord.
  regtest-solstice:
    name: Solstice regtest (bitcoind + ord)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Build the package and what it depends on
        run: npx turbo run build --filter=@sundial-protocol/solstice

      # Release binaries, pinned by SHA-256 in the harness's regtest.sh.
      - name: Cache regtest binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/btc-regtest/bin
          key: btc-regtest-ord-${{ runner.os }}-${{ hashFiles('node_modules/@sundial-protocol/btc-regtest/regtest.sh') }}

      - name: Run the regtest suite
        run: npm run regtest --workspace=@sundial-protocol/solstice

      - name: Show daemon logs
        if: failure()
        run: npx btc-regtest logs

  # The steps behind `btc-locker solstice etch`. The CLI has no build of its own.
  regtest-cli:
    name: CLI regtest (bitcoind + ord)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Build the package and what it depends on
        run: npx turbo run build --filter=@sundial-protocol/btc-locker-cli...

      # Release binaries, pinned by SHA-256 in the harness's regtest.sh.
      - name: Cache regtest binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/btc-regtest/bin
          key: btc-regtest-ord-${{ runner.os }}-${{ hashFiles('node_modules/@sundial-protocol/btc-regtest/regtest.sh') }}

      - name: Run the regtest suite
        run: npm run regtest --workspace=@sundial-protocol/btc-locker-cli

      - name: Show daemon logs
        if: failure()
        run: npx btc-regtest logs
