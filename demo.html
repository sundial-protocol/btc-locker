<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTC Locker - Browser Demo</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background-color: #1a1a1a;
        color: #00ff00;
      }
      .container {
        background-color: #000;
        padding: 20px;
        border-radius: 8px;
        margin: 20px 0;
        border: 1px solid #00ff00;
      }
      .output {
        background-color: #111;
        padding: 15px;
        border-radius: 4px;
        margin: 10px 0;
        font-family: monospace;
        white-space: pre-wrap;
        border-left: 3px solid #00ff00;
      }
      button {
        background-color: #00aa00;
        color: #000;
        border: none;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }
      button:hover {
        background-color: #00ff00;
      }
      h1,
      h2 {
        color: #00ff00;
        text-shadow: 0 0 5px #00ff00;
      }
      .warning {
        color: #ff6600;
        background-color: #2a1100;
        padding: 10px;
        border-left: 3px solid #ff6600;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>🔒 BTC Locker - Browser Demo</h1>

    <div class="warning">
      <strong>⚠️ Important:</strong> This is a demonstration only. Never use on
      Bitcoin mainnet without thorough testing on testnet first!
    </div>

    <div class="container">
      <h2>Basic Timelock Demo</h2>
      <button onclick="runBasicDemo()">Generate Basic Timelock</button>
      <div id="basicOutput" class="output"></div>
    </div>

    <div class="container">
      <h2>Multisig Timelock Demo</h2>
      <button onclick="runMultisigDemo()">
        Generate 2-of-3 Multisig Timelock
      </button>
      <div id="multisigOutput" class="output"></div>
    </div>

    <div class="container">
      <h2>HODL Script Demo</h2>
      <button onclick="runHodlDemo()">
        Generate HODL Script with Emergency Escape
      </button>
      <div id="hodlOutput" class="output"></div>
    </div>

    <div class="container">
      <h2>Relative Timelock Demo</h2>
      <button onclick="runRelativeDemo()">
        Generate Relative Timelock (144 blocks)
      </button>
      <div id="relativeOutput" class="output"></div>
    </div>

    <!-- Include the BTC Locker library -->
    <script src="dist/btc-locker.bundle.js"></script>

    <script>
      // Extract the library from the bundle
      const { BTCLocker, TimeUtils, ScriptUtils, TransactionUtils } =
        window.BTCLocker;

      function runBasicDemo() {
        const output = document.getElementById("basicOutput");
        output.textContent = "Generating basic timelock...";

        try {
          // Use testnet for demonstration
          const locker = new BTCLocker(/* testnet would need to be imported */);

          // Generate a key pair
          const keyPair = locker.generateKeyPair();

          // Create a timelock for 1 week from now
          const locktime = TimeUtils.addDuration(TimeUtils.DURATIONS.WEEK);
          const script = locker.createTimelockScript(
            locktime,
            keyPair.publicKey
          );

          const result = `Basic Timelock Generated:

Generated Key Pair:
• Private Key: ${keyPair.privateKey}
• Public Key: ${keyPair.publicKey}
• Address: ${keyPair.address}

Timelock Script:
• Script Address: ${script.address}
• Locktime: ${new Date(locktime * 1000).toISOString()}
• Script Hash: ${script.scriptHash}

To use:
1. Send Bitcoin to the script address
2. Wait until the locktime expires
3. Spend using the private key

⚠️ Keep the private key secure!`;

          output.textContent = result;
        } catch (error) {
          output.textContent = `Error: ${error.message}`;
        }
      }

      function runMultisigDemo() {
        const output = document.getElementById("multisigOutput");
        output.textContent = "Generating 2-of-3 multisig timelock...";

        try {
          const locker = new BTCLocker();

          // Generate three key pairs
          const keyPair1 = locker.generateKeyPair();
          const keyPair2 = locker.generateKeyPair();
          const keyPair3 = locker.generateKeyPair();

          // Create 2-of-3 multisig timelock (1 month)
          const locktime = TimeUtils.addDuration(TimeUtils.DURATIONS.MONTH);
          const publicKeys = [
            keyPair1.publicKey,
            keyPair2.publicKey,
            keyPair3.publicKey,
          ];
          const script = locker.createMultisigTimelockScript(
            locktime,
            2,
            publicKeys
          );

          const result = `2-of-3 Multisig Timelock Generated:

Key Pairs:
• Key 1: ${keyPair1.address}
• Key 2: ${keyPair2.address}
• Key 3: ${keyPair3.address}

Multisig Script:
• Script Address: ${script.address}
• Required Signatures: ${script.m} of ${script.publicKeys.length}
• Locktime: ${new Date(locktime * 1000).toISOString()}

To spend:
• Wait until locktime expires
• Provide signatures from any 2 of the 3 keys
• Include the redeem script`;

          output.textContent = result;
        } catch (error) {
          output.textContent = `Error: ${error.message}`;
        }
      }

      function runHodlDemo() {
        const output = document.getElementById("hodlOutput");
        output.textContent = "Generating HODL script...";

        try {
          const locker = new BTCLocker();

          // Generate owner and emergency key pairs
          const ownerKeyPair = locker.generateKeyPair();
          const emergencyKeyPair = locker.generateKeyPair();

          // Create HODL script (1 year lock)
          const locktime = TimeUtils.addDuration(TimeUtils.DURATIONS.YEAR);
          const script = locker.createHodlScript(
            locktime,
            ownerKeyPair.publicKey,
            emergencyKeyPair.publicKey
          );

          const result = `HODL Script with Emergency Escape:

Key Pairs:
• Owner: ${ownerKeyPair.address}
• Emergency Contact: ${emergencyKeyPair.address}

HODL Script:
• Script Address: ${script.address}
• Normal Unlock: ${new Date(locktime * 1000).toISOString()}
• Type: ${script.type}

Spending Options:
• Normal: Wait until locktime, spend with owner key only
• Emergency: Anytime with both owner + emergency signatures

This encourages long-term holding while providing a safety net.`;

          output.textContent = result;
        } catch (error) {
          output.textContent = `Error: ${error.message}`;
        }
      }

      function runRelativeDemo() {
        const output = document.getElementById("relativeOutput");
        output.textContent = "Generating relative timelock...";

        try {
          const locker = new BTCLocker();

          // Generate a key pair
          const keyPair = locker.generateKeyPair();

          // Create relative timelock (144 blocks ≈ 1 day)
          const script = locker.createRelativeTimelockScript(
            144,
            keyPair.publicKey
          );

          const result = `Relative Timelock Generated:

Key Pair:
• Private Key: ${keyPair.privateKey}
• Public Key: ${keyPair.publicKey}
• Address: ${keyPair.address}

Relative Timelock Script:
• Script Address: ${script.address}
• Sequence: ${script.sequence} blocks
• Approximate Duration: ${
            TimeUtils.blocksToSeconds(script.sequence) / 3600
          } hours

How it works:
• Funds are locked for ${script.sequence} blocks after confirmation
• Unlike absolute timelocks, this is relative to transaction confirmation
• Useful for payment channels and escrow with relative timing`;

          output.textContent = result;
        } catch (error) {
          output.textContent = `Error: ${error.message}`;
        }
      }

      // Show initial message
      document.addEventListener("DOMContentLoaded", function () {
        console.log("🔒 BTC Locker library loaded successfully!");
        console.log(
          "Click the buttons above to test different timelock types."
        );
      });
    </script>
  </body>
</html>
